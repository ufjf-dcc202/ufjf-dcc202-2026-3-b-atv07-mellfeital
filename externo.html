<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS Externo</title>
    <style>
        em {
            color: orange;
        }
        code {
            color:lime;
            text-decoration: underline;
            /* font-family: sans-serif;  */
        }
        dt > code {
            color: white;
            background-color: black;
        }
    </style>
</head>
<body>
    <main>
        <h1>DCC202 CSS Externo</h1>
        <p>Você pode aplicar um estilo <em >externo</em> para um elemento usando um atributo <code >link</code> no <code>head</code>.</p>

        <dl>
            <div>
                <dt><code>color</code></dt>
                <dd>Altera a cor texto do elemento</dd>
            </div>
            <div>
                <dt><code>background-color</code></dt>
                <dd>Altera a cor de fundo do elemento</dd>
            </div>
        </dl>
    </main>
</body>
</html>
